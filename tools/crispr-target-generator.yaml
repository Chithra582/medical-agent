name: crispr-target-generator
description: Generates candidate sgRNA guide sequences for designated genes and computes off-target specificity scores.
input_schema:
  type: object
  properties:
    gene_symbol:
      type: string
      description: Canonical HGNC gene symbol (e.g., 'PDCD1', 'TP53', 'EGFR').
    species:
      type: string
      description: Target organism species ('human' or 'mouse').
      default: "human"
    top_n:
      type: integer
      description: Number of top-ranked guide RNAs to return.
      default: 5
  required:
    - gene_symbol
